name: R11 test site
# Workflow changes also run a verified build and update the isolated test site.
# R33 acceptance: canonical object ordering and homepage QA server verified.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after a successful dry run and Pages verification
        type: boolean
        default: false
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/r11-test-pages.yml']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.revisions.outputs.changed }}
      preview_sha: ${{ steps.revisions.outputs.preview_sha }}
    steps:
      - name: Check out the current published repository
        uses: actions/checkout@v4
        with:
          path: published
          persist-credentials: false

      - name: Require private read-only access
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.R11_TEST_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo 'Missing R11_TEST_READ_TOKEN: grant contents read access to both private repositories.' >&2
            exit 1
          fi

      - name: Check out integration source
        uses: actions/checkout@v4
        with:
          repository: edsabirzyanov/perinatal-site
          ref: integration/r11-current
          token: ${{ secrets.R11_TEST_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Resolve immutable revisions and detect changes
        id: revisions
        env:
          GH_TOKEN: ${{ secrets.R11_TEST_READ_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git -C source rev-parse HEAD)
          preview_sha=$(git -C published rev-parse HEAD)
          editorial_sha=$(gh api 'repos/edsabirzyanov/perinatal-editorial-content/commits/test%2Fr11-direct-20261108' --jq .sha)
          [[ "$editorial_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "editorial_sha=$editorial_sha" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          echo "Source: $source_sha; editorial: $editorial_sha; preview: $preview_sha"
          changed=true
          if [ "$EVENT_NAME" = schedule ]; then
            if curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' 'https://edsabirzyanov.github.io/perinatal-preview/r11-test/deployment-revisions.json' -o /tmp/r11-deployed.json; then
              if jq -e --arg s "$source_sha" --arg e "$editorial_sha" '.source == $s and .editorial == $e' /tmp/r11-deployed.json >/dev/null; then
                changed=false
              fi
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Build required: $changed"

      - name: Set up Node.js
        if: steps.revisions.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/site/web/package-lock.json

      - name: Install dependencies
        if: steps.revisions.outputs.changed == 'true'
        working-directory: source/site/web
        run: npm ci --no-audit --no-fund

      - name: Validate CMS contracts and synchronize the pinned editorial snapshot
        if: steps.revisions.outputs.changed == 'true'
        working-directory: source/site/web
        env:
          GITHUB_TOKEN: ${{ secrets.R11_TEST_READ_TOKEN }}
          EDITORIAL_CONTENT_REF: ${{ steps.revisions.outputs.editorial_sha }}
        run: |
          node scripts/prepare-test-cms.mjs
          node scripts/verify-cms-contract.mjs
          npm run check
          node scripts/sync-editorial-from-github.mjs

      - name: Build isolated test site
        if: steps.revisions.outputs.changed == 'true'
        working-directory: source/site/web
        env:
          PUBLIC_EDITORIAL_PREVIEW: 'true'
          PUBLIC_EDITORIAL_CMS: 'true'
        run: |
          node node_modules/astro/bin/astro.mjs build --config astro.r11-test.config.mjs
          node scripts/verify-test-site.mjs

      - name: Verify shared contacts and sitewide responsive regression
        if: steps.revisions.outputs.changed == 'true' && github.event_name == 'push'
        working-directory: source/site/web
        env:
          PUBLIC_EDITORIAL_CMS: 'true'
          PUBLIC_EDITORIAL_PREVIEW: 'true'
          CMS_QA_DIR: .cache/cms-contacts
          CMS_QA_CODES: R01,R04,R11,R18,R19,R27,R29,R32,R33
          CMS_PIXEL_TOLERANCE: '8'
          CONTACT_BROWSER_QA: 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run check
          mkdir -p .cache/cms-contacts/baseline
          cp -a dist-r11-test/. .cache/cms-contacts/baseline/
          node scripts/verify-event-baseline.mjs
          node scripts/verify-contact-render.mjs
          node scripts/verify-structured-responsive.mjs

      - name: Upload contact acceptance evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cms-contacts-acceptance
          path: |
            source/site/web/.cache/cms-contacts/contracts.json
            source/site/web/.cache/cms-contacts/render.json
            source/site/web/.cache/cms-contacts/responsive.json
            source/site/web/.cache/cms-contacts/*.png
            source/site/web/.cache/cms-contacts/screenshots/
          if-no-files-found: warn

      - name: Verify and assemble Pages artifact
        if: steps.revisions.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ steps.revisions.outputs.source_sha }}
          EDITORIAL_SHA: ${{ steps.revisions.outputs.editorial_sha }}
          PREVIEW_SHA: ${{ steps.revisions.outputs.preview_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f source/site/web/dist-r11-test/index.html
          test -f source/site/web/dist-r11-test/departments/delivery/index.html
          test -f source/site/web/dist-r11-test/404.html
          test -f published/index.html
          test -f published/admin-r11-test/config.json
          grep -q 'noindex, nofollow' source/site/web/dist-r11-test/index.html
          grep -q '/perinatal-preview/r11-test/_astro/' source/site/web/dist-r11-test/index.html
          photo=$(node -p "require('./source/site/web/src/data/r11-live.generated.json').photos.rooms.src")
          if [ -n "$photo" ]; then
            photo_name=$(basename "$photo" | cut -d. -f1)
            grep -q "$photo_name" source/site/web/dist-r11-test/departments/delivery/index.html
          fi
          mkdir -p deploy/r11-test
          rsync -a --exclude='.git' --exclude='.github' --exclude='r11-test' published/ deploy/
          cp -a source/site/web/dist-r11-test/. deploy/r11-test/
          # The public test contains active pages only, as in the existing preview.
          rm -rf deploy/r11-test/example-components deploy/r11-test/style-guide
          rm -f deploy/r11-test/robots.txt deploy/r11-test/sitemap*.xml
          jq -n --arg s "$SOURCE_SHA" --arg e "$EDITORIAL_SHA" --arg p "$PREVIEW_SHA" '{source:$s,editorial:$e,preview:$p}' > deploy/r11-test/deployment-revisions.json
          if find deploy -type l | grep -q .; then echo 'Symlink in artifact' >&2; exit 1; fi
          test -f deploy/admin-r11-test/index.html
          test -f deploy/r11-test/departments/delivery/index.html

      - name: Upload dry-run artifact
        if: steps.revisions.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r11-test-site
          path: deploy/r11-test
          if-no-files-found: error

      - name: Verify live preview matches the preserved repository files
        if: steps.revisions.outputs.changed == 'true'
        working-directory: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PREVIEW_SHA: ${{ steps.revisions.outputs.preview_sha }}
          WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          current=$(gh api repos/edsabirzyanov/perinatal-preview/commits/main --jq .sha)
          test "$current" = "$EXPECTED_PREVIEW_SHA" || { echo 'Preview main changed during the build.' >&2; exit 1; }
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {readFile} = require('node:fs/promises');
          const paths = execFileSync('git', ['ls-files', '-z']).toString().split('\0').filter(Boolean)
            .filter(p => !p.startsWith('r11-test/') && !p.split('/').some(part => part.startsWith('.')))
            // A workflow/CMS release can precede its native Pages deployment. These
            // three CMS files are preserved in git and never staged by this deploy.
            .filter(p => !(process.env.WORKFLOW_EVENT === 'push' && /^admin-r11-test\/(index\.html|config\.json|validate\.js)$/.test(p)));
          if (!paths.includes('index.html')) throw Error('Missing preview');
          let next = 0;
          async function worker() {
            while (next < paths.length) {
              const path = paths[next++];
              const url = 'https://edsabirzyanov.github.io/perinatal-preview/' + path.split('/').map(encodeURIComponent).join('/');
              const response = await fetch(url, {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
              if (!response.ok || !Buffer.from(await response.arrayBuffer()).equals(await readFile(path))) throw Error(`Live preview differs: ${path} (HTTP ${response.status})`);
            }
          }
          Promise.all(Array.from({length:8}, worker)).then(() => console.log(`Preserved ${paths.length} live files`)).catch(e => {console.error(e.message); process.exitCode=1;});
          NODE

  deploy:
    needs: build
    if: >-
      needs.build.outputs.changed == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    steps:
      - name: Require restricted preview write token
        env:
          PREVIEW_WRITE_TOKEN: ${{ secrets.R11_PREVIEW_WRITE_TOKEN }}
        run: |
          if [ -z "$PREVIEW_WRITE_TOKEN" ]; then
            echo 'Missing R11_PREVIEW_WRITE_TOKEN: grant contents write access only to perinatal-preview.' >&2
            exit 1
          fi
      - name: Check out preview publishing branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.R11_PREVIEW_WRITE_TOKEN }}
          path: published
      - name: Download verified test site
        uses: actions/download-artifact@v4
        with:
          name: r11-test-site
          path: test-site
      - name: Commit only the isolated test directory
        env:
          EXPECTED_PREVIEW_SHA: ${{ needs.build.outputs.preview_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C published rev-parse HEAD)" = "$EXPECTED_PREVIEW_SHA" || { echo 'Preview changed since verification; retry on the new head.' >&2; exit 1; }
          test -f test-site/index.html
          test -f test-site/departments/delivery/index.html
          if find test-site -type l | grep -q .; then echo 'Symlink in test artifact' >&2; exit 1; fi
          if [ -L published/r11-test ]; then echo 'Unsafe test directory' >&2; exit 1; fi
          mkdir -p published/r11-test
          rsync -a --checksum --delete test-site/ published/r11-test/
          cmp test-site/deployment-revisions.json published/r11-test/deployment-revisions.json
          git -C published config user.name 'github-actions[bot]'
          git -C published config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C published add -- r11-test/
          if git -C published diff --cached --quiet; then echo 'Test site unchanged'; exit 0; fi
          git -C published commit -m 'Update isolated R11 test site'
          git -C published push origin HEAD:main



