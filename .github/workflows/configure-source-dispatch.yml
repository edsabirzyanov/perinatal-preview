name: Configure source dispatch
on:
  workflow_dispatch:
permissions: {}
jobs:
  seal:
    if: github.actor == 'edsabirzyanov'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyNaCl==1.5.0
      - name: Seal the existing preview-only token to the source repository key
        env:
          DISPATCH_TOKEN: ${{ secrets.PREVIEW_DISPATCH_TOKEN }}
        run: |
          python - <<'PY'
          import os, base64, json
          from nacl.public import PublicKey, SealedBox
          token = os.environ['DISPATCH_TOKEN']
          if not token:
              raise RuntimeError('Existing PREVIEW_DISPATCH_TOKEN is missing')
          public_key = PublicKey(base64.b64decode('ynKraDB2V/b3SELqgo+JUuhD5ynf5bK8VMuknHqW0QM='))
          sealed = base64.b64encode(SealedBox(public_key).encrypt(token.encode())).decode()
          with open('encrypted-source-dispatch.json', 'w') as output:
              json.dump({'key_id': '3380204578043523366', 'encrypted_value': sealed}, output)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-source-dispatch
          path: encrypted-source-dispatch.json
          retention-days: 1
          if-no-files-found: error
