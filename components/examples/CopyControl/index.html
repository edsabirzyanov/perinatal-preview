<!DOCTYPE html><html lang="en" class="prototype"><head><style>@layer base, patterns, components, utilities;</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>CopyControl · registry fixture</title><link rel="stylesheet" href="/perinatal-preview/components/_astro/Example.BXiZ1AiP.css"><link rel="stylesheet" href="/perinatal-preview/components/_astro/inventory.kUsLTnR2.css"></head><body><main class="registry-example_wrap" id="main"><a href="/perinatal-preview/components/#component-CopyControl">Back to CopyControl in the catalog</a><p>Live implementation · CopyControl · fixture, not design approval</p><section class="registry-example_sample" data-variant="default"><p>default</p><span class="copy-control_wrap"><button aria-label="Copy fixture: Registry" type="button" data-copy-value="registry-fixture" class="button_wrap link touch-target"><span class="button_text text-style-trim"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="icon small display-inline-block"><rect x="8" y="8" width="13" height="13" rx="2" /><path d="M16 5V3H3v13h2" /></svg> Copy fixture</span></button><span class="copy-control_status" role="status" aria-live="polite" aria-atomic="true"></span></span><script type="module">document.querySelectorAll(`[data-copy-value]`).forEach(e=>{e.hidden=!navigator.clipboard?.writeText,e.addEventListener(`click`,async()=>{let t=e.parentElement?.querySelector(`[role="status"]`);if(t){t.textContent=``;try{await navigator.clipboard.writeText(e.dataset.copyValue||``),t.textContent=`Скопировано`}catch{t.textContent=`Не удалось скопировать. Выделите и скопируйте текст вручную.`}}})});</script><noscript><style>.copy-control_wrap { display: none; }</style></noscript></section></main></body></html>
